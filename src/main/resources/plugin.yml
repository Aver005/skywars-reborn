name: SkyWars
main: ru.kiviuly.skywars.SkyWarsPlugin
version: '${version}'
api-version: '1.21'
author: kiviuly
description: SkyWars minigame (arenas, capsule start, kits, damage-race matches).
depend: [MgCore]
commands:
  sw:
    description: SkyWars commands (только арены SkyWars)
    usage: /sw help
    aliases: [skywars]
permissions:
  sw.admin:
    description: Админ-команды SkyWars (только его арены)
    default: op
